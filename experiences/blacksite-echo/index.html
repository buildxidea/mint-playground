<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Blacksite: Echo — an original cinematic Three.js first-person combat experience."
    />
    <meta name="theme-color" content="#080b0a" />
    <link rel="icon" type="image/png" href="/assets/mint/images/image-faction-insignia.png" />
    <title>Blacksite: Echo</title>
  </head>
  <body>
    <main id="app">
      <canvas
        id="game-canvas"
        aria-label="Blacksite Echo first-person game canvas"
        tabindex="0"
      ></canvas>
      <div id="ui-root"></div>
      <noscript>Blacksite: Echo requires JavaScript and WebGL 2.</noscript>
    </main>
    <a
      class="mint-badge"
      href="https://mint.gg/"
      target="_blank"
      rel="noreferrer"
      aria-label="Made with Mint"
    >
      <span>Made with</span>
      <img src="/mint-logo.svg" alt="" width="42" height="15" />
    </a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
