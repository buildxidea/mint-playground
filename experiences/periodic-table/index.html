<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Periodic Table 3D</title>
    <style>
      :root {
        --fg: #f2f2f2;
        --fg-dim: rgba(242, 242, 242, 0.6);
        --panel-bg: rgba(18, 18, 20, 0.82);
        --panel-border: rgba(255, 255, 255, 0.14);
        --accent: #7fd4ff;
      }
      html.light-bg {
        --fg: #141414;
        --fg-dim: rgba(20, 20, 20, 0.6);
        --panel-bg: rgba(250, 250, 250, 0.85);
        --panel-border: rgba(0, 0, 0, 0.14);
        --accent: #0077b6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      /* Loading / error overlay */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #f2f2f2;
        z-index: 40;
        transition: opacity 0.6s ease;
        text-align: center;
        padding: 24px;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay .spinner {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: #7fd4ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      #overlay.error .spinner { display: none; }
      #overlay .title { font-size: 15px; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(255,255,255,0.85); }
      #overlay .detail { font-size: 12px; color: rgba(255, 255, 255, 0.5); max-width: 420px; line-height: 1.6; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Tooltip */
      #tooltip {
        position: fixed;
        pointer-events: none;
        z-index: 20;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        color: var(--fg);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 14px));
        transition: opacity 0.15s ease;
        white-space: nowrap;
        backdrop-filter: blur(8px);
      }
      #tooltip.visible { opacity: 1; }
      #tooltip .sym { font-weight: 600; margin-right: 7px; color: var(--accent); }

      /* Icon buttons */
      .icon-btn {
        position: fixed;
        z-index: 30;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.3s ease;
        backdrop-filter: blur(8px);
        font-size: 17px;
      }
      .icon-btn:hover { transform: scale(1.08); }
      .icon-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      #settings-btn { top: 18px; right: 18px; }

      #exit-btn {
        top: 18px;
        left: 18px;
        width: auto;
        height: 42px;
        border-radius: 21px;
        padding: 0 18px 0 14px;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: flex;
        opacity: 0;
        pointer-events: none;
      }
      #exit-btn.visible { opacity: 1; pointer-events: auto; }

      /* Settings panel */
      #settings-panel {
        position: fixed;
        top: 70px;
        right: 18px;
        z-index: 30;
        width: 252px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 18px;
        color: var(--fg);
        backdrop-filter: blur(12px);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #settings-panel.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
      #settings-panel h3 {
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--fg-dim);
        margin-bottom: 12px;
        font-weight: 600;
      }
      .setting-group { margin-bottom: 16px; }
      .setting-group:last-child { margin-bottom: 0; }
      .setting-group .label { font-size: 11px; letter-spacing: 0.08em; color: var(--fg-dim); margin-bottom: 7px; }
      .seg {
        display: flex;
        gap: 4px;
        background: rgba(127, 127, 127, 0.12);
        border-radius: 8px;
        padding: 3px;
        flex-wrap: wrap;
      }
      .seg button {
        flex: 1 1 auto;
        min-width: 52px;
        border: none;
        background: transparent;
        color: var(--fg-dim);
        font-size: 11px;
        padding: 6px 4px;
        border-radius: 6px;
        cursor: pointer;
        letter-spacing: 0.04em;
        transition: background 0.15s ease, color 0.15s ease;
        font-family: inherit;
      }
      .seg button.active { background: var(--accent); color: #fff; }
      html.light-bg .seg button.active { color: #fff; }

      /* Mobile data sheet (replaces 3D panels on narrow screens) */
      #data-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 25;
        max-height: 44vh;
        overflow-y: auto;
        background: rgba(8, 10, 15, 0.88);
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(12px);
        color: #f2f5f9;
        padding: 6px 18px 20px;
        transform: translateY(105%);
        transition: transform 0.35s ease;
      }
      #data-sheet.visible { transform: translateY(0); }
      #data-sheet .grab {
        width: 42px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.3);
        margin: 6px auto 4px;
      }
      #data-sheet h4 {
        font-size: 10px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 14px 0 6px;
      }
      #data-sheet .row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 4px 0;
        font-size: 12.5px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #data-sheet .row span { color: rgba(242, 245, 249, 0.55); }
      #data-sheet .row b { font-weight: 500; text-align: right; }
      #data-sheet .summary {
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.55;
        color: rgba(242, 245, 249, 0.75);
      }

      @media (max-width: 640px) {
        #settings-panel { right: 12px; width: calc(100vw - 24px); max-width: 300px; }
        #settings-btn { top: 12px; right: 12px; }
        #exit-btn { top: 12px; left: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <div class="spinner"></div>
      <div class="title">Periodic Table</div>
      <div class="detail">Preparing elements…</div>
    </div>

    <div id="tooltip"></div>
    <div id="data-sheet"></div>

    <button id="exit-btn" class="icon-btn" aria-label="Exit element">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
      <span>Exit</span>
    </button>

    <button id="settings-btn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.6a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H2.4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V2.4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03h.17a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z" />
      </svg>
    </button>

    <div id="settings-panel">
      <h3>Settings</h3>
      <div class="setting-group">
        <div class="label">Material finish</div>
        <div class="seg" data-setting="finish">
          <button data-value="glossy">Glossy</button>
          <button data-value="matte">Matte</button>
          <button data-value="metallic">Metallic</button>
          <button data-value="satin">Satin</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="label">Board material</div>
        <div class="seg" data-setting="board">
          <button data-value="wood">Wood</button>
          <button data-value="plastic">Plastic</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="label">Background</div>
        <div class="seg" data-setting="background">
          <button data-value="black">Black</button>
          <button data-value="white">White</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="label">Tile colors</div>
        <div class="seg" data-setting="colorMode">
          <button data-value="category">Category</button>
          <button data-value="mono">Monochrome</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="label">Sound</div>
        <div class="seg" data-setting="sound">
          <button data-value="on">On</button>
          <button data-value="off">Muted</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
