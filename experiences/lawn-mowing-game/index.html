<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b9c8a4" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236a9b32'/%3E%3Crect x='6' y='7' width='4' height='18' fill='%23bcd98a'/%3E%3Crect x='14' y='7' width='4' height='18' fill='%23bcd98a'/%3E%3Crect x='22' y='7' width='4' height='18' fill='%23bcd98a'/%3E%3C/svg%3E"
    />
    <title>Mowed</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Mowed — lawn mowing game"></canvas>

      <section id="hud" aria-live="polite">
        <div id="hud-top">
          <div id="level-line">
            <span id="level-index">1 / 5</span>
            <span id="level-name">The Easy Rectangle</span>
          </div>
          <div id="hud-top-right">
            <div id="pattern-chip">
              <span id="pattern-icon" class="pattern-icon pattern-ns" aria-hidden="true"></span>
              <span id="pattern-label">North / South</span>
            </div>
            <button
              id="mute-button"
              class="hud-icon-button"
              type="button"
              aria-label="Mute sound"
              aria-pressed="false"
              title="Mute sound"
            >
              <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M4 9.5h3.2L11.6 6a.6.6 0 0 1 1 .5v11a.6.6 0 0 1-1 .5L7.2 14.5H4a.6.6 0 0 1-.6-.6v-3.8A.6.6 0 0 1 4 9.5Zm11.6-1.1a.9.9 0 0 1 1.3 0 5.1 5.1 0 0 1 0 7.2.9.9 0 1 1-1.3-1.3 3.3 3.3 0 0 0 0-4.6.9.9 0 0 1 0-1.3Zm2.6-2.6a.9.9 0 0 1 1.3 0 8.8 8.8 0 0 1 0 12.4.9.9 0 1 1-1.3-1.3 7 7 0 0 0 0-9.8.9.9 0 0 1 0-1.3Z"
                />
              </svg>
              <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M4 9.5h3.2L11.6 6a.6.6 0 0 1 1 .5v11a.6.6 0 0 1-1 .5L7.2 14.5H4a.6.6 0 0 1-.6-.6v-3.8A.6.6 0 0 1 4 9.5Zm12.2-.9a.9.9 0 0 1 1.3 0L19 10l1.5-1.4a.9.9 0 1 1 1.3 1.3L20.3 11.3l1.5 1.5a.9.9 0 0 1-1.3 1.3L19 12.6l-1.5 1.5a.9.9 0 1 1-1.3-1.3l1.5-1.5-1.5-1.4a.9.9 0 0 1 0-1.3Z"
                />
              </svg>
            </button>
            <button
              id="settings-button"
              class="hud-icon-button"
              type="button"
              aria-label="Settings"
              title="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.5 7.5 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6L4.6 11a7.7 7.7 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.5a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.4 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="hud-bottom">
          <div id="fuel-gauge">
            <div id="fuel-track"><div id="fuel-fill"></div></div>
            <span id="fuel-label">Fuel</span>
          </div>
          <div id="coverage-readout">
            <strong id="coverage-value">0%</strong>
            <span>mown</span>
          </div>
        </div>
      </section>

      <div id="overlay" hidden>
        <div id="overlay-card" role="dialog" aria-modal="true"></div>
      </div>

      <div id="title-screen"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
